<!doctype html>
<!-- 올빗 앱 아이콘 원본 (카카오 앱 아이콘용 임시). 크롬 헤드리스로 512×512 캡처해서 PNG를 만든다:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --window-size=512,512 --screenshot="$PWD/allbeat-icon-512.png" "file://$PWD/icon.html" -->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; }
  .icon {
    width: 512px; height: 512px; position: relative;
    background: radial-gradient(120% 120% at 20% 10%, #ff5fa2 0%, #ff2d7a 38%, #8a2cf0 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "AppleSDGothicNeo-Heavy", "Apple SD Gothic Neo", sans-serif;
  }
  /* 비트 막대: 이퀄라이저 느낌, 라임으로 키치하게 */
  .bars { display: flex; align-items: flex-end; gap: 14px; height: 96px; margin-bottom: 18px; }
  .bars i { display: block; width: 30px; border-radius: 15px; background: #d6ff3a; box-shadow: 0 6px 0 rgba(60, 0, 90, .25); }
  .word {
    font-size: 210px; font-weight: 900; line-height: 1; letter-spacing: -14px; color: #fff;
    text-shadow: 0 10px 0 rgba(60, 0, 90, .28);
  }
  .sub {
    margin-top: 22px; font-size: 34px; font-weight: 800; letter-spacing: 6px; color: #fff; opacity: .92;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .spark { position: absolute; color: #d6ff3a; font-size: 54px; font-weight: 900; font-family: Arial, sans-serif; }
</style>
</head>
<body>
  <div class="icon">
    <span class="spark" style="top:52px; right:62px;">✦</span>
    <span class="spark" style="bottom:70px; left:58px; font-size:34px;">✦</span>
    <div class="bars"><i style="height:46px"></i><i style="height:86px"></i><i style="height:62px"></i><i style="height:96px"></i><i style="height:40px"></i></div>
    <div class="word">올빗</div>
    <div class="sub">ALL THE BEAT</div>
  </div>
</body>
</html>
